[package]
name = "hazid-studio"
version = "0.2.0"
description = "HAZID study tool"
authors = ["Martin Gorriaran"]
license = "MIT"
edition = "2024"

[lib]
# The `_lib` suffix avoids a name clash with the bin target on Windows
name = "hazid_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
rust_xlsxwriter = "0.90"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
